<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 8" width="900" height="8" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#7b42bc" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="1.4"/></filter>
    <style>
      .mv{animation:mv 3.4s linear infinite;}
      @keyframes mv{from{transform:translateX(-260px);}to{transform:translateX(900px);}}
    </style>
  </defs>
  <rect x="0" y="3" width="900" height="1.6" fill="#21262d"/>
  <rect class="mv" x="0" y="2" width="260" height="3" rx="1.5" fill="url(#hl)" filter="url(#g)"/>
</svg>
