<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" fill="none" role="img" aria-label="Skill matrix">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b42bc"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <style>
      text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace;}
      .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards;}
      @keyframes grow{to{transform:scaleX(1);}}
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="328" rx="16" fill="#0d1117" stroke="url(#accent)" stroke-width="1.5"/>

  <text x="28" y="46" font-size="20" font-weight="700" fill="#00ff9c">// skill_matrix</text>
  <text x="872" y="46" text-anchor="end" font-size="12" fill="#7d8590">self-assessed · tuned by me</text>
  <line x1="28" y1="62" x2="872" y2="62" stroke="#21262d" stroke-width="1"/>

  <!-- row template: dot, name, track, fill -->
  <!-- 1 Vulnerability Research (offensive) .82 -->
  <circle cx="34" cy="96" r="4" fill="#ff7b72"/>
  <text x="48" y="100" font-size="14" fill="#c9d1d9">Vulnerability Research</text>
  <rect x="360" y="89" width="500" height="9" rx="4.5" fill="#161b22"/>
  <rect class="bar" style="animation-delay:.30s" x="360" y="89" width="410" height="9" rx="4.5" fill="url(#accent)"/>

  <!-- 2 Web / App Pentesting (offensive) .74 -->
  <circle cx="34" cy="132" r="4" fill="#ff7b72"/>
  <text x="48" y="136" font-size="14" fill="#c9d1d9">Web / App Pentesting</text>
  <rect x="360" y="125" width="500" height="9" rx="4.5" fill="#161b22"/>
  <rect class="bar" style="animation-delay:.45s" x="360" y="125" width="370" height="9" rx="4.5" fill="url(#accent)"/>

  <!-- 3 Threat Detection (defensive) .80 -->
  <circle cx="34" cy="168" r="4" fill="#00ff9c"/>
  <text x="48" y="172" font-size="14" fill="#c9d1d9">Threat Detection</text>
  <rect x="360" y="161" width="500" height="9" rx="4.5" fill="#161b22"/>
  <rect class="bar" style="animation-delay:.60s" x="360" y="161" width="400" height="9" rx="4.5" fill="url(#accent)"/>

  <!-- 4 Incident Response (defensive) .70 -->
  <circle cx="34" cy="204" r="4" fill="#00ff9c"/>
  <text x="48" y="208" font-size="14" fill="#c9d1d9">Incident Response</text>
  <rect x="360" y="197" width="500" height="9" rx="4.5" fill="#161b22"/>
  <rect class="bar" style="animation-delay:.75s" x="360" y="197" width="350" height="9" rx="4.5" fill="url(#accent)"/>

  <!-- 5 Python Automation (dev) .88 -->
  <circle cx="34" cy="240" r="4" fill="#6ea8ff"/>
  <text x="48" y="244" font-size="14" fill="#c9d1d9">Python Automation</text>
  <rect x="360" y="233" width="500" height="9" rx="4.5" fill="#161b22"/>
  <rect class="bar" style="animation-delay:.90s" x="360" y="233" width="440" height="9" rx="4.5" fill="url(#accent)"/>

  <!-- 6 Web (Next.js / TS) (dev) .78 -->
  <circle cx="34" cy="276" r="4" fill="#6ea8ff"/>
  <text x="48" y="280" font-size="14" fill="#c9d1d9">Web (Next.js / TypeScript)</text>
  <rect x="360" y="269" width="500" height="9" rx="4.5" fill="#161b22"/>
  <rect class="bar" style="animation-delay:1.05s" x="360" y="269" width="390" height="9" rx="4.5" fill="url(#accent)"/>

  <!-- legend -->
  <circle cx="34" cy="309" r="4" fill="#ff7b72"/><text x="46" y="313" font-size="12" fill="#7d8590">Offensive</text>
  <circle cx="150" cy="309" r="4" fill="#00ff9c"/><text x="162" y="313" font-size="12" fill="#7d8590">Defensive / SOC</text>
  <circle cx="315" cy="309" r="4" fill="#6ea8ff"/><text x="327" y="313" font-size="12" fill="#7d8590">Development</text>
</svg>
