<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" fill="none" role="img" aria-label="Madhu Bashyam — Cybersecurity Engineer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b42bc"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="898" height="278" rx="16"/></clipPath>
    <style>
      text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace;}
      .l{opacity:0;animation:appear .5s ease forwards;}
      @keyframes appear{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
      .cur{animation:blink 1.06s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}
      .scan{animation:sweep 4.2s linear infinite;}
      @keyframes sweep{0%{transform:translateY(-90px);}100%{transform:translateY(280px);}}
      .dot{animation:pulse 1.5s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="278" rx="16" fill="#0d1117" stroke="url(#accent)" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect class="scan" x="0" y="0" width="900" height="90" fill="url(#scan)"/>
  </g>

  <circle cx="30" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="450" y="35" text-anchor="middle" font-size="13" fill="#7d8590">madhu@soc: ~/secure</text>
  <line x1="20" y1="52" x2="880" y2="52" stroke="#21262d" stroke-width="1"/>

  <text class="l" style="animation-delay:.15s" x="34" y="96" font-size="16"><tspan fill="#00ff9c">$</tspan><tspan fill="#7d8590"> whoami</tspan></text>
  <text class="l" style="animation-delay:.6s" x="34" y="141" font-size="38" font-weight="700" fill="#00ff9c" filter="url(#glow)">Madhu Bashyam</text>
  <text class="l" style="animation-delay:1s" x="36" y="171" font-size="15" fill="#c9d1d9">Cyber Security Analyst · Threat Hunting · Incident Response</text>
  <text class="l" style="animation-delay:1.5s" x="34" y="211" font-size="16"><tspan fill="#00ff9c">$</tspan><tspan fill="#7d8590"> ./monitor --live </tspan><tspan fill="#7b42bc">[OK]</tspan></text>

  <text class="l" style="animation-delay:2s" x="34" y="245" font-size="15" fill="#7d8590">status:</text>
  <circle class="dot" cx="112" cy="240" r="5" fill="#00ff9c" filter="url(#glow)"/>
  <text class="l" style="animation-delay:2s" x="126" y="245" font-size="15" fill="#00ff9c">Cyber Security Analyst @ Fenergo</text>
  <text class="l" style="animation-delay:2.2s" x="428" y="245" font-size="15" fill="#7d8590">· Dublin, IE</text>
  <rect class="cur" x="540" y="233" width="10" height="15" fill="#00ff9c"/>
</svg>
